name: Bug report
description: Something in the plugin or a note doesn't work or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: The page in the plugin, or the note's name.
      placeholder: Character builder, or SRD 5.2.1/spells/fireball.md
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      description: Settings → General.
      placeholder: 1.11.4
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
