# Prepares a draft GitHub Release, by hand, from a commit on main.
#
#   Actions → Prepare Plugin Release → Run workflow → version: 0.1.0
#
# The tag is the version exactly — `0.1.0`, never `v0.1.0` — because Obsidian's
# community directory and BRAT both look the release up by `manifest.json`'s
# version. The version must already be in `manifest.json`, `package.json` and
# `versions.json`. The release stays a draft carrying `main.js`,
# `manifest.json` and `styles.css`; publishing it is a person's decision.
#
# Written by the export from the private repository; an edit made here is
# replaced by the next export.
name: Prepare Plugin Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare, exactly as in manifest.json (e.g. 0.1.0, no "v")'
        required: true
        type: string

concurrency:
  group: plugin-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Only from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Releases are only prepared from commits on main."; exit 1; }

      - name: Refuse a published release, or a draft or tag on another commit
        run: |
          if gh release view "$RELEASE_VERSION" --json isDraft,targetCommitish > existing-release.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' existing-release.json \
              || { echo "::error::Release $RELEASE_VERSION is already published, or is a draft on another commit."; exit 1; }
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$GITHUB_SHA" \
              || { echo "::error::Tag $RELEASE_VERSION already points at another commit."; exit 1; }
          fi

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # What Obsidian's directory review fails a release on: its own ESLint
      # rules, errors only. See eslint.directory.config.mjs.
      - name: Directory lint
        run: npm run lint:directory

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The directory's checks, plus the version: x.y.z, no "v", and the same
      # in manifest.json, package.json and versions.json.
      - name: Preflight
        run: npm run preflight -- --release "$RELEASE_VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obsidian-plugin-assets
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create or refresh the draft
        run: |
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            echo "Refreshing the assets of draft $RELEASE_VERSION."
          else
            gh release create "$RELEASE_VERSION" --draft --target "$GITHUB_SHA" \
              --title "Fifth Edition Vault $RELEASE_VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" dist/main.js dist/manifest.json dist/styles.css --clobber
          gh release view "$RELEASE_VERSION" --json assets --jq '[.assets[].name] | sort' > attached-assets.json
          jq -e '. == ["main.js", "manifest.json", "styles.css"]' attached-assets.json \
            || { echo "::error::The draft does not carry exactly main.js, manifest.json and styles.css."; exit 1; }
          echo "Draft $RELEASE_VERSION is ready for review and manual publication." >> "$GITHUB_STEP_SUMMARY"
